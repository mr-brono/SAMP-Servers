name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Android v1 embedding
        run: |
          rm -rf android
          mv lib/main.dart lib/main.dart.bak || true
          flutter create . --platforms=android --project-name samp_servers --org com.sampserverspro
          mv lib/main.dart.bak lib/main.dart || true

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SAMP-Servers-APK
          path: build/app/outputs/flutter-apk/app-release.apk
